name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt
      - run: python -m unittest tests.test_pipeline tests.test_retrieve tests.test_progress tests.test_eval_harness tests.test_diagnose tests.test_trace
